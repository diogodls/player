services:
  postgres:
    image: postgres:16-alpine
    container_name: player_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=player
      - POSTGRES_USER=player
      - POSTGRES_PASSWORD=player
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
      - ./backend/seeds-comparison.sql:/docker-entrypoint-initdb.d/03-seeds-comparison.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U player -d player"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: player_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host"

  backend:
    build:
      context: ./
      dockerfile: docker/backend/Dockerfile
    container_name: player_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORT=3000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=player
      - DATABASE_USER=player
      - DATABASE_PASSWORD=player
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npm run start:dev"

  mock:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run mock"
    ports:
      - "3001:3001"

volumes:
  postgres_data:
