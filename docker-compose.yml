services:
  frontend:
    build:
      context: ./
      dockerfile: docker/frontend/Dockerfile
    container_name: player_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host

  mock:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm run mock"
    ports:
      - "3001:3001"